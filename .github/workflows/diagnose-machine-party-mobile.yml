name: Diagnose Machine Party mobile UI and minigame sources

on:
  push:
    branches:
      - "recovery/ui-performance-review"
    paths:
      - ".github/workflows/diagnose-machine-party-mobile.yml"

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Download recovered source and publish gameplay load-flow excerpts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p downloaded docs/diagnostics
          gh run download 44350091150 --repo "$GH_REPO" --name machine-party-recovery --dir downloaded
          PROJECT="$PWD/downloaded/recovered"
          REPORT="$PWD/docs/diagnostics/gameplay-load-flow.txt"
          {
            for spec in \
              "modules/multiplayer/network_manager.gd:1:320" \
              "scenes/lobby/scripts/lobby_scene.gd:1:540" \
              "scenes/lobby/components/playlist_handler.gd:1:300" \
              "modules/multiplayer_lobby/components/lobby_handler/lobby_handler.gd:180:270" \
              "autoloads/globals.gd:420:590" \
              "autoloads/game_manager.gd:1:190"; do
              file="${spec%%:*}"
              rest="${spec#*:}"
              start="${rest%%:*}"
              end="${rest##*:}"
              echo
              echo "===== $file lines $start-$end ====="
              sed -n "${start},${end}p" "$PROJECT/$file"
            done
          } | tee "$REPORT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          git commit -m "Add gameplay loading flow audit"
          git push origin "HEAD:${{ github.ref_name }}"

          INPUT_REPORT="$PWD/docs/diagnostics/mobile-input-performance.txt"
          {
            echo "===== JOYSTICK FILES ====="
            find "$PROJECT" -type f \( -iname '*joystick*' -o -iname '*virtual*stick*' \) -print | sort
            echo
            echo "===== VIRTUAL JOYSTICK DECLARATIONS AND INPUT BRIDGES ====="
            grep -R -n --include='*.gd' -E 'class_name VirtualJoystick|VirtualJoystick|Input\.action_(press|release)|Input\.parse_input_event' "$PROJECT/addons" "$PROJECT" 2>/dev/null | head -240 || true
            echo
            echo "===== GAMEPLAY INPUT AND MOVEMENT CALL SITES ====="
            grep -R -n --include='*.gd' -E 'Input\.get_vector|Input\.get_axis|Input\.is_action_pressed|move_and_slide|set_physics_process|_physics_process' "$PROJECT/minigames" "$PROJECT/modules" 2>/dev/null | head -320 || true
            echo
            echo "===== EXPLODING COLLAR RACE SCRIPTS ====="
            find "$PROJECT/minigames/exploding_collar_race" -type f -name '*.gd' -print0 | sort -z | while IFS= read -r -d '' file; do
              echo
              echo "----- ${file#"$PROJECT/"} -----"
              sed -n '1,260p' "$file"
            done
            echo
            echo "===== ANDROID CONTROLS AND MOBILE OPTIMIZER ====="
            for file in controls_android.gd AllInOneMobileOptimizer.gd MobileBoost.gd autoloads/globals.gd modules/pause_menu/scripts/pause_menu.gd; do
              if [ -f "$PROJECT/$file" ]; then
                echo
                echo "----- $file -----"
                sed -n '1,360p' "$PROJECT/$file"
              fi
            done
          } | tee "$INPUT_REPORT"
          git add "$INPUT_REPORT"
          git commit -m "Add mobile joystick and performance audit"
          git push origin "HEAD:${{ github.ref_name }}"

name: Clean up old Actions artifacts

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove failed builds and redundant artifacts safely
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const [artifacts, runs] = await Promise.all([
              github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 }),
              github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner, repo, per_page: 100 })
            ]);

            const runById = new Map(runs.map(r => [r.id, r]));
            const newestByName = new Map();
            for (const a of artifacts) {
              if (a.expired) continue;
              const prior = newestByName.get(a.name);
              if (!prior || new Date(a.created_at) > new Date(prior.created_at)) newestByName.set(a.name, a);
            }

            const keepIds = new Set();
            for (const name of ['machine-party-recovery', 'machine-party-lan-universal', 'godot-resource-audit', 'mobile-performance-input-audit']) {
              const newest = newestByName.get(name);
              if (newest) keepIds.add(newest.id);
            }

            const deletions = artifacts.filter(a => {
              if (a.expired || keepIds.has(a.id) || a.name === 'machine-party-recovery') return false;
              if (['machine-party-lan-universal', 'godot-resource-audit', 'mobile-performance-input-audit', 'machine-party-android-emulator-report'].includes(a.name)) return true;
              const run = runById.get(a.workflow_run?.id);
              return run && ['failure', 'cancelled', 'timed_out', 'action_required'].includes(run.conclusion);
            });

            const bytes = deletions.reduce((sum, a) => sum + a.size_in_bytes, 0);
            core.info('Preserving the recovery artifact and the newest APK, resource audit, and source audit.');
            core.info(`Found ${artifacts.length} artifacts; preserving ${keepIds.size} newest/protected artifacts.`);
            core.info(`Deleting ${deletions.length} redundant/failed artifacts (${(bytes / 1024 / 1024).toFixed(1)} MiB reported).`);

            for (const a of deletions) {
              core.info(`Deleting ${a.name} | ID ${a.id} | ${a.size_in_bytes} bytes | created ${a.created_at}`);
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
            }

            core.notice(`Cleanup finished: deleted ${deletions.length} artifacts. Recovery and newest retained outputs were not touched.`);

name: Clean up old Actions artifacts

on:
  workflow_dispatch:
    inputs:
      older_than_days:
        description: "Delete artifacts older than this many days (recovery and resource audit are always preserved)"
        required: true
        default: "14"
        type: string

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old, non-protected artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const rawDays = Number.parseInt(core.getInput('older_than_days'), 10);
            if (!Number.isInteger(rawDays) || rawDays < 1 || rawDays > 3650) {
              core.setFailed('older_than_days must be an integer between 1 and 3650.');
              return;
            }

            const protectedNames = new Set([
              'machine-party-recovery',
              'godot-resource-audit'
            ]);
            const cutoff = Date.now() - rawDays * 24 * 60 * 60 * 1000;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            const candidates = artifacts.filter(a =>
              !a.expired &&
              !protectedNames.has(a.name) &&
              new Date(a.created_at).getTime() < cutoff
            );

            core.info(`Found ${artifacts.length} artifacts in total.`);
            core.info(`Keeping protected artifacts: ${[...protectedNames].join(', ')}`);
            core.info(`Age cutoff: ${new Date(cutoff).toISOString()}`);
            core.info(`Deleting ${candidates.length} artifact(s).`);

            for (const artifact of candidates) {
              core.info(`Deleting "${artifact.name}" (ID ${artifact.id}, created ${artifact.created_at}, ${artifact.size_in_bytes} bytes)`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }

            core.notice(`Cleanup complete. Deleted ${candidates.length} old artifact(s); protected artifacts were not touched.`);

name: Diagnose Machine Party mobile UI and minigame sources

on:
  push:
    branches:
      - "recovery/ui-performance-review"
    paths:
      - ".github/workflows/diagnose-machine-party-mobile.yml"

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Download recovered source and publish targeted source excerpts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p downloaded docs/diagnostics
          gh run download 44350091150 --repo "$GH_REPO" --name machine-party-recovery --dir downloaded
          PROJECT="$PWD/downloaded/recovered"
          REPORT="$PWD/docs/diagnostics/mobile-source-excerpts.txt"
          {
            for file in MobileBoost.gd MobileLightOptimizer.gd AllInOneMobileOptimizer.gd controls_android.gd; do
              echo
              echo "===== $file ====="
              sed -n '1,280p' "$PROJECT/$file" 2>/dev/null || true
            done
            for file in scenes/main_menu/scripts/main_menu.gd modules/multiplayer/network_manager.gd scenes/lobby/scripts/lobby_scene.gd autoloads/globals.gd project.godot; do
              echo
              echo "===== $file relevant sections ====="
              grep -n -C 8 -E 'LineEdit|join_lobby|start_join|StartJoin|scaling_3d_scale|set_scaling|renderer/rendering|autoload|change_scene|start_client|virtual_keyboard|touchscreen' "$PROJECT/$file" 2>/dev/null | head -240 || true
            done
            echo
            echo "===== main_menu.gd complete around join controls ====="
            sed -n '330,435p' "$PROJECT/scenes/main_menu/scripts/main_menu.gd"
            echo
            echo "===== project settings rendering block ====="
            grep -n -A70 '^\[rendering\]' "$PROJECT/project.godot" | head -90
          } | tee "$REPORT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          git commit -m "Add mobile source excerpts for targeted optimization"
          git push origin "HEAD:${{ github.ref_name }}"

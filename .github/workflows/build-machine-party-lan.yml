name: Build Machine Party LAN Universal Android APK

on:
  push:
    branches:
      - "recovery/**"
      - "optimization/**"
    paths:
      - "tools/apply_machine_party_lan_patch.py"
      - "tools/optimize_mobile_performance.py"
      - "tools/test_mobile_optimizer.py"
      - "tools/smoke_test_minigame_scenes.gd"
      - "tools/audit_recovered_minigames.py"
      - "tools/test_recovered_gameplay_fixes.py"
      - "tools/smoke_test_crawl_animation.gd"
      - "tools/smoke_test_transition_overlay.gd"
      - "tools/repair_crawl_animation.gd"
      - "tools/lan_loopback_smoke.gd"
      - ".github/workflows/build-machine-party-lan.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout LAN patch tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Unit-test mobile optimizer before building
        run: python3 -m unittest -v tools/test_mobile_optimizer.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o /tmp/android-cmdline-tools.zip
          mkdir -p /tmp/android-cmdline-tools
          unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-cmdline-tools
          mv /tmp/android-cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-35" \
            "ndk;28.1.13356709" \
            "cmake;3.10.2.4988404"

      - name: Download recovered Machine Party project
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p downloaded build
          gh run download 44350091150 \
            --repo "$GH_REPO" \
            --name machine-party-recovery \
            --dir downloaded
          test -f downloaded/recovered/project.godot
          PROJECT="$PWD/downloaded/recovered"
          echo "===== AUDIT: Android/mobile renderer settings (before patch) ====="
          grep -nE 'renderer/rendering_method|config/features|Steamworks' "$PROJECT/project.godot" || true
          echo "===== AUDIT: Steamworks autoload script ====="
          if [ -f "$PROJECT/modules/steamworks/steamworks.gd" ]; then sed -n '1,180p' "$PROJECT/modules/steamworks/steamworks.gd"; fi
          echo "===== AUDIT: GameManager startup references ====="
          if [ -f "$PROJECT/autoloads/game_manager.gd" ]; then sed -n '1,130p' "$PROJECT/autoloads/game_manager.gd"; fi
          echo "===== AUDIT: Shape Cutter test and PatternMatcher references ====="
          if [ -f "$PROJECT/minigames/shape_cutter/scripts/shape_cutter_test.gd" ]; then sed -n '1,180p' "$PROJECT/minigames/shape_cutter/scripts/shape_cutter_test.gd"; fi
          grep -RIn --include='*.gd' 'class_name PatternMatcher\|pattern_points\|PatternPoints' "$PROJECT/minigames/shape_cutter" | head -60 || true
          python3 tools/audit_recovered_minigames.py "$PROJECT" | tee build/recovered-minigame-audit.txt
          echo "===== AUDIT: affected texture import metadata ====="
          find "$PROJECT" -type f -name '*.import' \
            \( -iname '*smoke_07*' -o -iname '*Techno_03*' -o -iname '*blood11*' -o -iname '*server_rack_seamless*' \) \
            -print -exec sed -n '1,120p' {} \; || true
          # The recovery artifact also contains a ZIP copy of the same project.
          # Keep the extracted project only to preserve disk space for APK signing.
          rm -rf downloaded/recovery-output
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/system-images /usr/local/lib/android/sdk/sources
          df -h

      - name: Apply LAN patch and prepare Android-compatible build
        run: |
          set -euo pipefail
          python3 tools/apply_machine_party_lan_patch.py downloaded/recovered
          python3 tools/optimize_mobile_performance.py downloaded/recovered
          python3 tools/test_recovered_gameplay_fixes.py downloaded/recovered
          cp recovered-project/controls_android.gd downloaded/recovered/controls_android.gd
          python3 -m py_compile tools/optimize_mobile_performance.py tools/apply_machine_party_lan_patch.py tools/test_recovered_gameplay_fixes.py
          PROJECT="$PWD/downloaded/recovered"
          test "$(wc -l < "$PROJECT/project.godot")" -gt 300
          grep -Fqx '[application]' "$PROJECT/project.godot"
          grep -Fqx '[rendering]' "$PROJECT/project.godot"
          grep -Fqx 'renderer/rendering_method.mobile="gl_compatibility"' "$PROJECT/project.godot"
          grep -Fqx 'textures/vram_compression/import_etc2_astc=true' "$PROJECT/project.godot"

          # The local build does not use Steam or the unavailable native audio-gate extension.
          rm -f "$PROJECT/addons/audio_gate/audio_gate.gdextension"
          rm -f "$PROJECT/addons/godotsteam/godotsteam.gdextension"
          rm -f "$PROJECT/addons/steam-multiplayer-peer/steam-multiplayer-peer.gdextension"

          mkdir -p "$PROJECT/build"
          cat > "$PROJECT/export_presets.cfg" <<'EOF'
          [preset.0]
          name="Android Universal (ARMv7 + ARM64)"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/MachineParty-LAN-universal.apk"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=3
          version/name="1.0.1-LAN"
          package/unique_name="com.godot.game"
          package/name="Machine Party"
          package/signed=true
          keystore/debug="/home/runner/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          permissions/internet=true
          screen/immersive_mode=true
          EOF

          mkdir -p /home/runner/.android
          keytool -genkeypair -v \
            -keystore /home/runner/.android/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -keystore /home/runner/.android/debug.keystore -storepass android | grep androiddebugkey

      - name: Download Godot 4.5.2 editor and Android export templates
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -type f -name 'Godot_*_linux.x86_64' | head -n1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "$GODOT_BIN" > /tmp/godot-bin-path

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz" \
            -o /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          if [ -d /tmp/godot-templates/templates ]; then
            cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          else
            cp -a /tmp/godot-templates/. "$TEMPLATE_DIR/"
          fi
          echo "4.5.2.stable" > "$TEMPLATE_DIR/version.txt"
          ls -lh "$TEMPLATE_DIR"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Import recovered project
        run: |
          set -euo pipefail
          GODOT_BIN="$(cat /tmp/godot-bin-path)"
          PROJECT="$PWD/downloaded/recovered"
          grep -q 'renderer/rendering_method.mobile="gl_compatibility"' "$PROJECT/project.godot"
          grep -q 'textures/vram_compression/import_etc2_astc=true' "$PROJECT/project.godot"
          # The ETC2/ASTC project setting does not retroactively convert textures
          # already imported for desktop. Remove only the generated import cache.
          rm -rf "$PROJECT/.godot/imported"
          export GODOT_SILENCE_ROOT_WARNING=1
          timeout 25m "$GODOT_BIN" --headless --editor \
            --path "$PROJECT" --quit
          test -d "$PROJECT/.godot/imported"
          echo "Android Compatibility renderer + ETC2/ASTC texture import confirmed."

      - name: Repair crawl animation bone paths
        run: |
          set -euo pipefail
          GODOT_BIN="$(cat /tmp/godot-bin-path)"
          PROJECT="$PWD/downloaded/recovered"
          export GODOT_SILENCE_ROOT_WARNING=1
          timeout 90s "$GODOT_BIN" --headless --path "$PROJECT" --script "$PWD/tools/repair_crawl_animation.gd" 2>&1 | tee build/crawl-animation-repair.log
          grep -q 'CRAWL_REPAIR_PASS:' build/crawl-animation-repair.log
          test -s "$PROJECT/animations/crawl_idle_overwrite_mobile.tres"
          test -s "$PROJECT/animations/crawl_overwrite_mobile.tres"
          grep -q 'crawl_idle_overwrite_mobile.tres' "$PROJECT/minigames/exploding_collar_race/components/player/exploding_collar_race_player.tscn"
          grep -q 'crawl_overwrite_mobile.tres' "$PROJECT/minigames/exploding_collar_race/components/player/exploding_collar_race_player.tscn"

      - name: Run headless game startup smoke test
        run: |
          set -euo pipefail
          GODOT_BIN="$(cat /tmp/godot-bin-path)"
          PROJECT="$PWD/downloaded/recovered"
          mkdir -p build
          export GODOT_SILENCE_ROOT_WARNING=1
          if ! timeout 90s "$GODOT_BIN" --headless --path "$PROJECT" --quit-after 180 --verbose 2>&1 | tee build/headless-startup.log; then
            echo "===== HEADLESS STARTUP FAILURE ====="
            tail -n 240 build/headless-startup.log
            exit 1
          fi
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed loading resource' build/headless-startup.log; then
            echo "===== SCRIPT OR RESOURCE ERRORS DURING STARTUP ====="
            grep -Ein 'SCRIPT ERROR:|Parse Error:|Failed loading resource' build/headless-startup.log
            exit 1
          fi
          echo "Headless startup smoke test passed (180 frames)."

      - name: Load every minigame scene headlessly
        run: |
          set -euo pipefail
          GODOT_BIN="$(cat /tmp/godot-bin-path)"
          PROJECT="$PWD/downloaded/recovered"
          mkdir -p build
          export GODOT_SILENCE_ROOT_WARNING=1
          if ! timeout 5m "$GODOT_BIN" --headless --path "$PROJECT" --script "$PWD/tools/smoke_test_minigame_scenes.gd" 2>&1 | tee build/minigame-scenes-smoke.log; then
            echo "===== MINIGAME SCENE LOAD FAILURES ====="
            tail -n 240 build/minigame-scenes-smoke.log
            exit 1
          fi
          grep -q 'MINIGAME_SCENE_SMOKE_PASS' build/minigame-scenes-smoke.log
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed loading resource|MINIGAME_SCENE_LOAD_FAILED' build/minigame-scenes-smoke.log; then
            echo "===== MINIGAME RESOURCE OR SCRIPT ERRORS ====="
            grep -Ein 'SCRIPT ERROR:|Parse Error:|Failed loading resource|MINIGAME_SCENE_LOAD_FAILED' build/minigame-scenes-smoke.log
            exit 1
          fi

      - name: Test injured-player crawl animation at runtime
        run: |
          set -euo pipefail
          GODOT_BIN="$(cat /tmp/godot-bin-path)"
          PROJECT="$PWD/downloaded/recovered"
          export GODOT_SILENCE_ROOT_WARNING=1
          timeout 90s "$GODOT_BIN" --headless --path "$PROJECT" --script "$PWD/tools/smoke_test_crawl_animation.gd" 2>&1 | tee build/crawl-animation-smoke.log
          grep -q 'CRAWL_ANIMATION_SMOKE_PASS:' build/crawl-animation-smoke.log
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|CRAWL_ANIMATION_SMOKE_FAILED' build/crawl-animation-smoke.log; then
            echo "===== CRAWL ANIMATION SMOKE FAILURE ====="
            grep -Ein 'SCRIPT ERROR:|Parse Error:|CRAWL_ANIMATION_SMOKE_FAILED' build/crawl-animation-smoke.log
            exit 1
          fi

      - name: Test overlapping scene transition fades
        run: |
          set -euo pipefail
          GODOT_BIN="$(cat /tmp/godot-bin-path)"
          PROJECT="$PWD/downloaded/recovered"
          export GODOT_SILENCE_ROOT_WARNING=1
          timeout 45s "$GODOT_BIN" --headless --path "$PROJECT" --script "$PWD/tools/smoke_test_transition_overlay.gd" 2>&1 | tee build/transition-overlay-smoke.log
          grep -q 'TRANSITION_OVERLAY_SMOKE_PASS:' build/transition-overlay-smoke.log
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|TRANSITION_OVERLAY_SMOKE_FAILED' build/transition-overlay-smoke.log; then
            echo "===== TRANSITION OVERLAY SMOKE FAILURE ====="
            grep -Ein 'SCRIPT ERROR:|Parse Error:|TRANSITION_OVERLAY_SMOKE_FAILED' build/transition-overlay-smoke.log
            exit 1
          fi

      - name: Test LAN host-client handshake over ENet
        run: |
          set -euo pipefail
          GODOT_BIN="$(cat /tmp/godot-bin-path)"
          PROJECT="$PWD/downloaded/recovered"
          mkdir -p build
          HOST_LOG="$PWD/build/lan-host-smoke.log"
          CLIENT_LOG="$PWD/build/lan-client-smoke.log"
          PROJECT_CONFIG="$PROJECT/project.godot"
          CONFIG_BACKUP="$PWD/build/project.godot.before-lan-smoke"
          TEST_SCRIPT="$PROJECT/lan_loopback_smoke.gd"
          TEST_SCENE="$PROJECT/lan_loopback_smoke.tscn"
          cp "$PROJECT_CONFIG" "$CONFIG_BACKUP"
          cleanup() {
            if [ -n "${HOST_PID:-}" ]; then
              kill "$HOST_PID" 2>/dev/null || true
            fi
            cp "$CONFIG_BACKUP" "$PROJECT_CONFIG"
            rm -f "$TEST_SCRIPT" "$TEST_SCENE"
          }
          trap cleanup EXIT
          cp "$PWD/tools/lan_loopback_smoke.gd" "$TEST_SCRIPT"
          cat > "$TEST_SCENE" <<'EOF'
          [gd_scene load_steps=2 format=3]
          [ext_resource type="Script" path="res://lan_loopback_smoke.gd" id="1"]
          [node name="LanLoopbackSmoke" type="Node"]
          script = ExtResource("1")
          EOF
          python3 - "$PROJECT_CONFIG" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          key = 'run/main_scene='
          lines = source.splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith(key)]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one {key} setting, got {len(matches)}")
          lines[matches[0]] = 'run/main_scene="res://lan_loopback_smoke.tscn"'
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          export GODOT_SILENCE_ROOT_WARNING=1
          timeout 45s "$GODOT_BIN" --headless --path "$PROJECT" -- host >"$HOST_LOG" 2>&1 &
          HOST_PID=$!
          for attempt in $(seq 1 100); do
            if grep -q 'LAN_TEST_HOST_READY=' "$HOST_LOG"; then
              break
            fi
            if ! kill -0 "$HOST_PID" 2>/dev/null; then
              wait "$HOST_PID" || true
              cat "$HOST_LOG"
              exit 1
            fi
            sleep 0.2
          done
          HOST_ADDRESS="$(sed -n 's/^LAN_TEST_HOST_READY=//p' "$HOST_LOG" | tail -n 1)"
          if [ -z "$HOST_ADDRESS" ]; then
            echo "LAN host did not become ready."
            cat "$HOST_LOG"
            exit 1
          fi
          echo "Testing LAN address: $HOST_ADDRESS"
          if ! timeout 30s "$GODOT_BIN" --headless --path "$PROJECT" -- client "$HOST_ADDRESS" >"$CLIENT_LOG" 2>&1; then
            echo "===== LAN CLIENT FAILURE ====="
            cat "$CLIENT_LOG"
            cat "$HOST_LOG"
            exit 1
          fi
          if ! wait "$HOST_PID"; then
            echo "===== LAN HOST FAILURE ====="
            cat "$HOST_LOG"
            cat "$CLIENT_LOG"
            exit 1
          fi
          HOST_PID=""
          cp "$CONFIG_BACKUP" "$PROJECT_CONFIG"
          rm -f "$TEST_SCRIPT" "$TEST_SCENE"
          trap - EXIT
          cat "$HOST_LOG"
          cat "$CLIENT_LOG"
          grep -q 'LAN_LOOPBACK_PASS:host:' "$HOST_LOG"
          grep -q 'LAN_LOOPBACK_PASS:client:' "$CLIENT_LOG"

      - name: Export Android APK
        run: |
          set -euo pipefail
          GODOT_BIN="$(cat /tmp/godot-bin-path)"
          PROJECT="$PWD/downloaded/recovered"
          echo "===== EFFECTIVE RENDERER SETTINGS ====="
          grep -nE 'config/features|renderer/rendering_method' "$PROJECT/project.godot"
          grep -q 'renderer/rendering_method.mobile="gl_compatibility"' "$PROJECT/project.godot"
          grep -q 'textures/vram_compression/import_etc2_astc=true' "$PROJECT/project.godot"
          export GODOT_SILENCE_ROOT_WARNING=1
          if ! "$GODOT_BIN" --headless --path "$PROJECT" --verbose \
            --export-debug "Android Universal (ARMv7 + ARM64)" "$PWD/build/MachineParty-LAN-universal.apk" \
            2>&1 | tee build/android-export.log; then
            echo "===== ANDROID EXPORT FAILURE DETAILS ====="
            tail -n 300 build/android-export.log
            exit 1
          fi
          test -s build/MachineParty-LAN-universal.apk
          ls -lh build/MachineParty-LAN-universal.apk

      - name: Verify APK and create compressed download
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools/35.0.0" -name apksigner | head -n1)"
          "$APKSIGNER" verify --verbose build/MachineParty-LAN-universal.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 build/MachineParty-LAN-universal.apk
          (cd build && sha256sum MachineParty-LAN-universal.apk > APK-SHA256SUMS.txt)

          sudo apt-get update
          sudo apt-get install -y p7zip-full
          (cd build && 7z a -t7z -mx=9 -m0=lzma2:d=128m:fb=273 -mmt=2 -ms=on \
            MachineParty-LAN-universal.7z MachineParty-LAN-universal.apk APK-SHA256SUMS.txt)
          (cd build && sha256sum MachineParty-LAN-universal.7z > SHA256SUMS.txt)
          ls -lh build/MachineParty-LAN-universal.apk build/MachineParty-LAN-universal.7z build/SHA256SUMS.txt

      - name: Audit APK ABI contents
        run: |
          python3 - <<'PY'
          import zipfile
          apk = "build/MachineParty-LAN-universal.apk"
          with zipfile.ZipFile(apk) as zf:
              names = zf.namelist()
              abis = sorted({
                  name.split("/")[1]
                  for name in names
                  if name.startswith("lib/") and len(name.split("/")) > 2
              })
              print("Native ABIs in APK:", abis)
              expected = {"armeabi-v7a", "arm64-v8a"}
              if abis != sorted(expected):
                  raise SystemExit(f"Expected exactly ARMv7 + ARM64; found {abis}")
              print("ABI audit passed: universal ARMv7 + ARM64 APK")
              print("Largest APK entries:")
              for info in sorted(zf.infolist(), key=lambda item: item.file_size, reverse=True)[:20]:
                  print(f"{info.file_size:>12}  {info.filename}")
          PY

      - name: Upload compressed package only
        uses: actions/upload-artifact@v4
        with:
          name: machine-party-lan-universal
          path: |
            build/MachineParty-LAN-universal.7z
            build/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish compressed universal ARMv7 + ARM64 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="machine-party-lan-universal-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            build/MachineParty-LAN-universal.apk \
            build/MachineParty-LAN-universal.7z \
            build/APK-SHA256SUMS.txt \
            build/SHA256SUMS.txt \
            --repo "$GH_REPO" \
            --title "Machine Party LAN - Android Universal (ARMv7 + ARM64)" \
            --notes "Direct APK plus compressed mirror. Universal ARMv7 (armeabi-v7a) + ARM64 (arm64-v8a). Godot 4.5.2. Debug-signed; for testing, not a production release."

# Build universal ARMv7 + ARM64 LAN APK; package losslessly with ultra LZMA2.

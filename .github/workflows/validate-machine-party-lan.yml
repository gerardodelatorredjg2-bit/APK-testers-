                      if j not in seen:
                          lines_out.append(f"{j+1}: {lines[j]}")
                          seen.add(j)
                  lines_out.append("---")
                  hits += 1
                  if hits >= 500:
                      lines_out.append("[LIMIT: 500 matching lines]")
                      break
              if hits >= 500:
                  break
          output.write_text("\n".join(lines_out) if lines_out else "No relevant UI/network/rendering matches found.", encoding="utf-8")
          print(f"Saved {hits} matching source lines to {output}")
          PY
          find "$PROJECT" -type f \( -iname '*joystick*' -o -iname '*touch*control*' -o -iname '*mobile*control*' \) \
            -not -path '*/.godot/*' -not -path '*/addons/*' | sort > validation-output/mobile-control-files.txt || true
          echo "===== Relevant mobile control files ====="
          cat validation-output/mobile-control-files.txt || true
          echo "===== First audit matches ====="
          sed -n '1,1000p' "$OUT"

      - name: Dump exact source files for LAN menu and mobile controls
        run: |

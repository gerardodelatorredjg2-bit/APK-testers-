name: Extract original Machine Party third-person character

on:
  push:
    branches: ["optimization/**"]
    paths:
      - ".github/workflows/extract-third-person-character.yml"

permissions:
  actions: read
  contents: read

jobs:
  extract-character:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Download original recovery artifact read-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14449215398/zip" \
            -o recovery-artifact.zip
          unzip -tq recovery-artifact.zip

      - name: Extract original Godot project
        run: |
          set -euo pipefail
          inner="$(unzip -Z1 recovery-artifact.zip | grep -E '(^|/)machine-party-recovered-project[.]zip$' | head -n1)"
          test -n "$inner"
          unzip -p recovery-artifact.zip "$inner" > project-source.zip
          unzip -tq project-source.zip
          mkdir project
          unzip -q project-source.zip -d project
          test -s project/project.godot
          echo "Extracted project size: $(du -sh project | cut -f1)"

      - name: Select and validate the third-person character GLB
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil

          root = Path("project")
          glbs = sorted(root.rglob("*.glb")) + sorted(root.rglob("*.GLB"))
          if not glbs:
              raise SystemExit("No GLB files found in original Machine Party project.")

          hints = {
              "player": 140, "character": 120, "avatar": 115,
              "humanoid": 105, "human": 95, "worker": 90,
              "npc": 80, "person": 80, "citizen": 75,
              "body": 55, "default": 40, "base": 35,
              "rig": 25, "skeleton": 25
          }
          avoid = {
              "level": 45, "environment": 45, "map": 35,
              "floor": 30, "wall": 30, "building": 25,
              "prop": 20, "weapon": 20, "vehicle": 20
          }
          ref_re = re.compile(r'res://([^"\s<>]+?\.glb)', re.IGNORECASE)
          records = {}

          for p in glbs:
              rel = str(p.relative_to(root)).replace("\\", "/")
              low = rel.lower()
              score, why = 0, []

              for word, pts in hints.items():
                  if word == "player":
                      matched = bool(re.search(r"(^|[/ _-])player($|[/ _-])", low))
                  else:
                      matched = word in low
                  if matched:
                      score += pts
                      why.append("name:" + word)

              for word, pts in avoid.items():
                  if word in low:
                      score -= pts

              # Prefer a full third-person body, not the first-person hand rig.
              if "first person" in low or "first_person" in low:
                  score -= 150
                  why.append("exclude:first-person-arms-rig")
              if "third person" in low or "third_person" in low:
                  score += 125
                  why.append("prefer:third-person-character")

              size = p.stat().st_size
              score += max(0, 18 - min(18, (size // (1024 * 1024)) * 2))
              records[rel] = {"path": p, "score": score, "refs": 0, "why": why}

          for scene in root.rglob("*.tscn"):
              try:
                  txt = scene.read_text(errors="ignore")
              except OSError:
                  continue
              scene_low = str(scene.relative_to(root)).lower()
              character_scene = any(w in scene_low for w in ("player", "character", "avatar", "lobby"))
              for raw in ref_re.findall(txt):
                  key = raw.replace("\\", "/")
                  if key not in records:
                      continue
                  rec = records[key]
                  rec["refs"] += 1
                  rec["score"] += 90 if character_scene else 2
                  if character_scene:
                      rec["why"].append("scene:" + str(scene.relative_to(root)))

          ranked = sorted(
              records.values(),
              key=lambda r: (r["score"], r["refs"], -r["path"].stat().st_size),
              reverse=True
          )
          best = ranked[0]
          out = Path("out")
          out.mkdir(exist_ok=True)
          safe = re.sub(r"[^A-Za-z0-9._-]+", "_", best["path"].stem).strip("_") or "character"
          target = out / f"MachineParty_{safe}.glb"
          shutil.copy2(best["path"], target)

          report = [
              "Source: original recovered Machine Party Godot project",
              f"Model resource: {best['path']}",
              f"Output: {target}",
              f"Bytes: {target.stat().st_size}",
              f"Selection score: {best['score']}",
              f"Scene references: {best['refs']}",
              "Reasons: " + ", ".join(best["why"]),
              "",
              "Top candidates:"
          ]
          for item in ranked[:15]:
              report.append(f"{item['path']} | score={item['score']} | refs={item['refs']} | bytes={item['path'].stat().st_size}")
          (out / "EXTRACTION_INFO.txt").write_text("\n".join(report) + "\n")
          print("\n".join(report))

          if target.stat().st_size < 1000:
              raise SystemExit("Selected model is suspiciously small; not uploading.")
          PY

      - name: Upload the single extracted model
        uses: actions/upload-artifact@v4
        with:
          name: machine-party-third-person-character
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

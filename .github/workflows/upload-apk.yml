name: Download APK and attach to private Release

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: "Direct HTTPS download URL for the APK"
        required: false
        default: "https://ts.buzzheavier.com/d/gavgm8mls4sf?v=HP2qnDxcNunRtBcII66KLTAIUJTvjs9Ks-F1D23NKEppp_eTvBMJb00QWmNSG4BA4yqJn2BelfEoI5lLLek6RwVSjro8-b0r-LlGHn6H2AUEGUb8XV1ZK_FZmwKrIE7vIrdWTKmeq-gTTJQD8Ft3mzzus0Ne70rlZeFvsjo"
        type: string
      file_name:
        description: "APK filename (optional)"
        required: false
        default: "machine-party-v1.0.0.apk"
        type: string

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate URL and filename
        id: input
        shell: bash
        env:
          DOWNLOAD_URL: ${{ inputs.download_url }}
          REQUESTED_NAME: ${{ inputs.file_name }}
        run: |
          set -euo pipefail
          case "$DOWNLOAD_URL" in
            https://*) ;;
            *) echo "Only HTTPS download URLs are accepted."; exit 1 ;;
          esac
          NAME="$(basename -- "$REQUESTED_NAME")"
          NAME="${NAME//[^a-zA-Z0-9._-]/_}"
          [[ "$NAME" == *.apk ]] || NAME="${NAME}.apk"
          [[ -n "$NAME" && "$NAME" != ".apk" ]] || { echo "Invalid filename"; exit 1; }
          echo "file_name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Download APK
        shell: bash
        env:
          DOWNLOAD_URL: ${{ inputs.download_url }}
          FILE_NAME: ${{ steps.input.outputs.file_name }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 2400 \
            --output "$RUNNER_TEMP/$FILE_NAME" "$DOWNLOAD_URL"
          test -s "$RUNNER_TEMP/$FILE_NAME"
          SIZE="$(stat -c%s "$RUNNER_TEMP/$FILE_NAME")"
          if (( SIZE > 2147483648 )); then
            echo "File exceeds GitHub's 2 GiB release-asset limit."
            exit 1
          fi
          unzip -t "$RUNNER_TEMP/$FILE_NAME" >/dev/null
          echo "Downloaded $(numfmt --to=iec-i --suffix=B "$SIZE")"
          sha256sum "$RUNNER_TEMP/$FILE_NAME" | tee "$RUNNER_TEMP/SHA256SUMS.txt"

      - name: Create private Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          FILE_NAME: ${{ steps.input.outputs.file_name }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="machine-party-${RUN_NUMBER}-${GITHUB_RUN_ID}"
          gh release create "$TAG" "$RUNNER_TEMP/$FILE_NAME#Machine Party APK" \
            "$RUNNER_TEMP/SHA256SUMS.txt#SHA256SUMS.txt" \
            --repo "$REPO" \
            --title "Machine Party v1.0.0" \
            --notes "APK downloaded automatically. SHA-256 checksum is included in SHA256SUMS.txt."
          echo "Release created: https://github.com/$REPO/releases/tag/$TAG"

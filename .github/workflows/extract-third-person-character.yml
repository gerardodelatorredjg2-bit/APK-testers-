name: Extract original Machine Party third-person character

on:
  push:
    branches: ["optimization/**"]
    paths:
      - ".github/workflows/extract-third-person-character.yml"

permissions:
  actions: read
  contents: read

jobs:
  extract-character:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Download original recovery artifact read-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14449215398/zip" \
            -o recovery-artifact.zip
          unzip -tq recovery-artifact.zip

      - name: Extract original Godot project
        run: |
          set -euo pipefail
          inner="$(unzip -Z1 recovery-artifact.zip | grep -E '(^|/)machine-party-recovered-project[.]zip$' | head -n1)"
          test -n "$inner"
          unzip -p recovery-artifact.zip "$inner" > project-source.zip
          unzip -tq project-source.zip
          mkdir project
          unzip -q project-source.zip -d project
          test -s project/project.godot
          echo "Extracted project size: $(du -sh project | cut -f1)"

      - name: Select and validate the third-person character GLB
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re, struct, shutil

          root = Path("project")
          def inspect_glb(path):
              data = path.read_bytes()
              if len(data) < 20 or data[:4] != b"glTF":
                  return None
              version, total = struct.unpack_from("<II", data, 4)
              if version != 2 or total != len(data):
                  return None
              offset = 12
              doc = None
              while offset + 8 <= len(data):
                  size, kind = struct.unpack_from("<II", data, offset)
                  offset += 8
                  chunk = data[offset:offset+size]
                  if len(chunk) != size:
                      return None
                  if kind == 0x4E4F534A:
                      try: doc = json.loads(chunk.decode("utf-8").rstrip("\\x00 "))
                      except Exception: return None
                      break
                  offset += size
              if not doc:
                  return None
              meshes = doc.get("meshes", [])
              vertices = 0
              primitives = 0
              for mesh in meshes:
                  for prim in mesh.get("primitives", []):
                      pos = prim.get("attributes", {}).get("POSITION")
                      if isinstance(pos, int) and 0 <= pos < len(doc.get("accessors", [])):
                          vertices += doc["accessors"][pos].get("count", 0)
                          primitives += 1
              return {"meshes": len(meshes), "vertices": vertices, "primitives": primitives,
                      "materials": len(doc.get("materials", [])), "nodes": len(doc.get("nodes", []))}

          candidates = []
          for p in sorted(root.rglob("*")):
              if not p.is_file() or p.suffix.lower() != ".glb":
                  continue
              stats = inspect_glb(p)
              if not stats or stats["meshes"] == 0 or stats["vertices"] < 20 or stats["primitives"] == 0:
                  print(f"REJECT no real mesh geometry: {p}")
                  continue
              rel = str(p.relative_to(root)).replace("\\\\", "/")
              low = rel.lower()
              score = 0
              reasons = []
              hints = {"player":140,"character":120,"avatar":115,"humanoid":105,"human":95,
                       "worker":90,"npc":80,"person":80,"citizen":75,"body":55,"default":40,"base":35}
              for word, points in hints.items():
                  if word in low: score += points; reasons.append("name:"+word)
              if "third person" in low or "third_person" in low: score += 110; reasons.append("third-person")
              if "first person" in low or "first_person" in low or "hand" in low or "arms" in low:
                  score -= 200; reasons.append("penalty:first-person/limbs")
              if any(x in low for x in ("level","environment","map","floor","wall","building","prop","weapon","vehicle")):
                  score -= 60
              score += min(stats["vertices"]//100, 80)
              score += min(stats["meshes"]*3, 30)
              candidates.append({"path":p,"score":score,"stats":stats,"reasons":reasons})
          if not candidates:
              raise SystemExit("No valid GLB with actual mesh geometry found; refusing to upload skeleton-only GLB.")
          ranked=sorted(candidates,key=lambda c:(c["score"],c["stats"]["vertices"],c["path"].stat().st_size),reverse=True)
          best=ranked[0]
          out=Path("out"); out.mkdir(exist_ok=True)
          safe=re.sub(r"[^A-Za-z0-9._-]+","_",best["path"].stem).strip("_") or "character"
          target=out/f"MachineParty_{safe}.glb"
          shutil.copy2(best["path"],target)
          report=["Source: original recovered Machine Party project",f"Selected: {best['path']}",
                  f"Output: {target}",f"File bytes: {target.stat().st_size}",
                  f"GLB geometry stats: {best['stats']}",f"Score: {best['score']}","",
                  "Ranked valid candidates:"]
          for c in ranked[:20]:
              report.append(f"{c['path']} | score={c['score']} | stats={c['stats']} | bytes={c['path'].stat().st_size}")
          (out/"EXTRACTION_INFO.txt").write_text("\\n".join(report)+"\\n")
          print("\\n".join(report))
          PY

      - name: Upload the single extracted model
        uses: actions/upload-artifact@v4
        with:
          name: machine-party-third-person-character
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

name: Machine Party lean Android reconstruction build

on:
  push:
    branches: ["optimization/**"]
    paths:
      - ".github/workflows/lean-android-export.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout reconstruction tools
        uses: actions/checkout@v4
        with:
          ref: lean-machine-party-rebuild
          path: rebuild-tools

      - name: Download and verify complete recovered project
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p recovered_parts recovered_manifest
          gh run download 44799934975 --repo "$GH_REPO" --pattern "machine-party-recovery-part-*" --dir recovered_parts
          gh run download 44799934975 --repo "$GH_REPO" --name machine-party-recovery-manifest --dir recovered_manifest
          for n in $(seq 0 9); do
            i="$(printf "%02d" "$n")"
            test -s "recovered_parts/machine-party-recovery-part-$i/part-$i"
          done
          cat recovered_parts/machine-party-recovery-part-*/part-* > recovery-artifact.zip
          sha256sum --check recovered_manifest/SHA256SUMS.txt
          unzip -tq recovery-artifact.zip
          mkdir -p project
          unzip -p recovery-artifact.zip recovery-output/machine-party-recovered-project.zip > project-source.zip
          unzip -tq project-source.zip
          unzip -q project-source.zip -d project
          test -s project/project.godot
          rm -rf project/.godot recovered_parts recovered_manifest
          rm -f recovery-artifact.zip project-source.zip
          echo "Recovered project size: $(du -sh project | cut -f1)"
          echo "Recovered project files: $(find project -type f | wc -l)"

      - name: Prepare clean Android source and LAN mobile UI
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/rebuild-tools" python3 -m unittest -v rebuild-tools/tools/test_prepare_lean_project.py
          python3 rebuild-tools/tools/prepare_lean_project.py "$PWD/project"
          python3 -m py_compile rebuild-tools/tools/prepare_lean_project.py rebuild-tools/tools/apply_lean_mobile_lan.py rebuild-tools/tools/optimize_audio_assets.py
          python3 rebuild-tools/tools/apply_lean_mobile_lan.py "$PWD/project"
          grep -Fq 'func set_controls_visible(value: bool) -> void:' project/controls_android.gd
          grep -Fq 'func toggle_controls_visible() -> void:' project/controls_android.gd
          grep -Fq 'func discover_hosts(' project/modules/multiplayer/backends/lan_discovery.gd
          grep -Fq 'func _show_lan_join_dialog()' project/scenes/main_menu/scripts/main_menu.gd
          grep -Fq 'func _show_lan_address_banner()' project/scenes/lobby/scripts/lobby_scene.gd

      - name: Reduce audio on the disposable build copy
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 rebuild-tools/tools/optimize_audio_assets.py "$PWD/project" --quality 4.0
          cp project/lean_audio_optimization.csv audio-optimization.csv

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK, NDK and CMake
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 3 "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/android-cmdline-tools.zip
          mkdir -p /tmp/android-cmdline-tools
          unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-cmdline-tools
          mv /tmp/android-cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-35" \
            "ndk;28.1.13356709" \
            "cmake;3.10.2.4988404"

      - name: Install Godot 4.5.2 and Android export templates
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -type f -name 'Godot_*_linux.x86_64' | head -n1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "$GODOT_BIN" > godot-bin-path
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz" -o /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          if [ -d /tmp/godot-templates/templates ]; then
            cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          else
            cp -a /tmp/godot-templates/. "$TEMPLATE_DIR/"
          fi
          echo "4.5.2.stable" > "$TEMPLATE_DIR/version.txt"
          mkdir -p "$HOME/.config/godot" /home/runner/.android
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          keytool -genkeypair -v -keystore /home/runner/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure lean universal Android export
        run: |
          set -euo pipefail
          mkdir -p project/build
          cat > project/export_presets.cfg <<'EOF'
          [preset.0]
          name="Android Universal (ARMv7 + ARM64)"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="resources"
          include_filter=""
          exclude_filter=""
          export_path="build/MachineParty-Lean-Android.apk"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=4
          version/name="1.1.0-Lean"
          package/unique_name="com.godot.game"
          package/name="Machine Party"
          package/signed=true
          keystore/debug="/home/runner/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          permissions/internet=true
          screen/immersive_mode=true
          EOF
          grep -Fqx 'renderer/rendering_method.mobile="gl_compatibility"' project/project.godot
          grep -Fqx 'textures/vram_compression/import_etc2_astc=true' project/project.godot

      - name: Clean Godot import
        run: |
          set -euo pipefail
          GODOT_BIN="$(cat godot-bin-path)"
          mkdir -p logs
          export GODOT_SILENCE_ROOT_WARNING=1
          timeout 45m "$GODOT_BIN" --headless --audio-driver Dummy --editor --path "$PWD/project" --import 2>&1 | tee logs/import.log
          test -d project/.godot/imported
          grep -E "SCRIPT ERROR:|Parse Error:|Failed loading resource|ERROR:" logs/import.log | grep -Ev "ObjectDB instances leaked at exit|resources still in use at exit|RID allocations of type|Pages in use exist at exit" > logs/import-errors.txt || true
          test ! -s logs/import-errors.txt

      - name: Boot game and load every minigame scene
        run: |
          set -euo pipefail
          GODOT_BIN="$(cat godot-bin-path)"
          export GODOT_SILENCE_ROOT_WARNING=1
          timeout 150 "$GODOT_BIN" --headless --audio-driver Dummy --path "$PWD/project" --quit-after 90 2>&1 | tee logs/main-boot.log
          grep -E "SCRIPT ERROR:|Parse Error:|Failed loading resource|ERROR:" logs/main-boot.log | grep -Ev "ObjectDB instances leaked at exit|resources still in use at exit|RID allocations of type|Pages in use exist at exit" > logs/boot-errors.txt || true
          test ! -s logs/boot-errors.txt
          timeout 180 "$GODOT_BIN" --headless --audio-driver Dummy --path "$PWD/project" --script "$PWD/rebuild-tools/tools/smoke_test_rebuild_minigame_scenes.gd" 2>&1 | tee logs/minigame-scenes.log
          grep -q "MINIGAME_SCENE_LOAD_PASS" logs/minigame-scenes.log

      - name: Test real LAN host-client ENet handshake
        run: |
          set -euo pipefail
          GODOT_BIN="$(cat godot-bin-path)"
          mkdir -p logs
          HOST_LOG="$PWD/logs/lan-host-smoke.log"
          CLIENT_LOG="$PWD/logs/lan-client-smoke.log"
          PROJECT_CONFIG="$PWD/project/project.godot"
          CONFIG_BACKUP="$PWD/logs/project.godot.before-lan-smoke"
          TEST_SCRIPT="$PWD/project/lan_loopback_smoke.gd"
          TEST_SCENE="$PWD/project/lan_loopback_smoke.tscn"
          cp "$PROJECT_CONFIG" "$CONFIG_BACKUP"
          cleanup() {
            if [ -n "${HOST_PID:-}" ]; then kill "$HOST_PID" 2>/dev/null || true; fi
            cp "$CONFIG_BACKUP" "$PROJECT_CONFIG"
            rm -f "$TEST_SCRIPT" "$TEST_SCENE"
          }
          trap cleanup EXIT
          cp "$PWD/rebuild-tools/tools/lan_loopback_smoke.gd" "$TEST_SCRIPT"
          cat > "$TEST_SCENE" <<'EOF'
          [gd_scene load_steps=2 format=3]
          [ext_resource type="Script" path="res://lan_loopback_smoke.gd" id="1"]
          [node name="LanLoopbackSmoke" type="Node"]
          script = ExtResource("1")
          EOF
          python3 - "$PROJECT_CONFIG" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          lines = p.read_text(encoding="utf-8").splitlines()
          keys = [i for i, line in enumerate(lines) if line.startswith("run/main_scene=")]
          if len(keys) != 1:
              raise SystemExit(f"Expected one run/main_scene setting, got {len(keys)}")
          lines[keys[0]] = 'run/main_scene="res://lan_loopback_smoke.tscn"'
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          export GODOT_SILENCE_ROOT_WARNING=1
          timeout 45s "$GODOT_BIN" --headless --audio-driver Dummy --path "$PWD/project" -- host >"$HOST_LOG" 2>&1 &
          HOST_PID=$!
          for attempt in $(seq 1 100); do
            if grep -q 'LAN_TEST_HOST_READY=' "$HOST_LOG"; then break; fi
            if ! kill -0 "$HOST_PID" 2>/dev/null; then
              wait "$HOST_PID" || true
              cat "$HOST_LOG"
              exit 1
            fi
            sleep 0.2
          done
          HOST_ADDRESS="$(sed -n 's/^LAN_TEST_HOST_READY=//p' "$HOST_LOG" | tail -n 1)"
          test -n "$HOST_ADDRESS" || { cat "$HOST_LOG"; exit 1; }
          echo "Testing LAN address: $HOST_ADDRESS"
          if ! timeout 30s "$GODOT_BIN" --headless --audio-driver Dummy --path "$PWD/project" -- client "$HOST_ADDRESS" >"$CLIENT_LOG" 2>&1; then
            cat "$CLIENT_LOG"; cat "$HOST_LOG"; exit 1
          fi
          if ! wait "$HOST_PID"; then cat "$HOST_LOG"; cat "$CLIENT_LOG"; exit 1; fi
          HOST_PID=""
          cp "$CONFIG_BACKUP" "$PROJECT_CONFIG"
          rm -f "$TEST_SCRIPT" "$TEST_SCENE"
          trap - EXIT
          grep -q 'LAN_LOOPBACK_PASS:host:' "$HOST_LOG"
          grep -q 'LAN_LOOPBACK_PASS:client:' "$CLIENT_LOG"
          cat "$HOST_LOG"
          cat "$CLIENT_LOG"

      - name: Export Android universal APK
        run: |
          set -euo pipefail
          GODOT_BIN="$(cat godot-bin-path)"
          export GODOT_SILENCE_ROOT_WARNING=1
          timeout 60m "$GODOT_BIN" --headless --audio-driver Dummy --path "$PWD/project" --export-debug "Android Universal (ARMv7 + ARM64)" "$PWD/project/build/MachineParty-Lean-Android.apk" 2>&1 | tee logs/android-export.log
          test -s project/build/MachineParty-Lean-Android.apk
          unzip -tq project/build/MachineParty-Lean-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose project/build/MachineParty-Lean-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging project/build/MachineParty-Lean-Android.apk > logs/apk-badging.txt
          grep -F "package: name='com.godot.game'" logs/apk-badging.txt
          stat -c 'APK_BYTES=%s' project/build/MachineParty-Lean-Android.apk | tee logs/apk-size.txt
          du -sh project/build/MachineParty-Lean-Android.apk

      - name: Upload reconstructed APK and validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-party-lean-android-apk
          path: |
            project/build/MachineParty-Lean-Android.apk
            audio-optimization.csv
            logs/
          retention-days: 30
          compression-level: 0

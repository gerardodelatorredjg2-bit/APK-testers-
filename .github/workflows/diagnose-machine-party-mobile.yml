name: Diagnose Machine Party mobile UI and minigame sources

on:
  push:
    branches:
      - "recovery/ui-performance-review"
    paths:
      - ".github/workflows/diagnose-machine-party-mobile.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Download recovered source and audit performance/input paths
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p downloaded audit
          gh run download 44350091150 --repo "$GH_REPO" --name machine-party-recovery --dir downloaded
          PROJECT="$PWD/downloaded/recovered"
          test -f "$PROJECT/project.godot"
          REPORT="$PWD/audit/mobile-performance-input.txt"
          {
            echo "===== PROJECT CONFIG ====="
            sed -n '1,300p' "$PROJECT/project.godot"
            echo
            echo "===== MOBILE / OPTIMIZER / CONTROL SCRIPTS ====="
            find "$PROJECT" -type f \( -iname '*mobile*.gd' -o -iname '*boost*.gd' -o -iname '*optimizer*.gd' -o -iname '*controls_android*.gd' -o -iname '*joystick*.gd' -o -iname '*virtual*stick*.gd' \) -print | sort
            while IFS= read -r file; do
              echo
              echo "----- ${file#"$PROJECT/"} -----"
              sed -n '1,420p' "$file"
            done < <(find "$PROJECT" -type f \( -iname '*mobile*.gd' -o -iname '*boost*.gd' -o -iname '*optimizer*.gd' -o -iname '*controls_android*.gd' -o -iname '*joystick*.gd' -o -iname '*virtual*stick*.gd' \) -print | sort)
            echo
            echo "===== INPUT ACTION / MOVEMENT REFERENCES ====="
            grep -R -n --include='*.gd' -E 'Input\.action_(press|release)|Input\.parse_input_event|Input\.get_vector|Input\.get_axis|Input\.is_action_pressed|move_and_slide|_physics_process' "$PROJECT" 2>/dev/null | head -500 || true
            echo
            echo "===== TOUCH / INPUT EVENT HANDLING ====="
            grep -R -n --include='*.gd' -E 'InputEventScreen|InputEventMouseButton|_input\(|_unhandled_input\(|gui_input|touch|joystick' "$PROJECT" 2>/dev/null | head -500 || true
            echo
            echo "===== FIRST MINIGAME CANDIDATES ====="
            find "$PROJECT/minigames" -maxdepth 2 -type f \( -name '*.tscn' -o -name '*.gd' \) -print | sort | head -500 || true
            echo
            echo "===== SCENE LOADING / AUTO PLAYLIST / MENU REFERENCES ====="
            grep -R -n --include='*.gd' -E 'change_scene|instantiate\(|ResourceLoader|load_threaded|preload\(|shuffle|randomize|playlist|scaling_3d_scale|set_scaling_3d_scale' "$PROJECT/scenes" "$PROJECT/modules" "$PROJECT/autoloads" 2>/dev/null | head -700 || true
            echo
            echo "===== QUALITY / SCALING SETTINGS REFERENCES ====="
            grep -R -n --include='*.gd' --include='*.tscn' --include='*.tres' -E 'scaling_3d_scale|quality|rendering_method|texture_filter|shadow|ssao|ssil|sdfgi|volumetric_fog|glow' "$PROJECT" 2>/dev/null | head -700 || true
            echo
            echo "===== LARGE TEXTURE / AUDIO INVENTORY ====="
            find "$PROJECT" -type f \( -iname '*.png' -o -iname '*.webp' -o -iname '*.jpg' -o -iname '*.ogg' -o -iname '*.wav' \) -printf '%s %p\n' | sort -nr | head -100 || true
            echo
            echo "===== CHARACTER CUSTOMIZATION SOURCE FILES ====="
            find "$PROJECT" -type f \( -path '*character customization*' -o -iname '*customization*' -o -iname '*cosmetic*' -o -iname '*accessor*' \) \( -name '*.gd' -o -name '*.tscn' -o -name '*.tres' -o -name '*.import' \) -print | sort
            while IFS= read -r file; do
              echo
              echo "----- ${file#"$PROJECT/"} -----"
              case "$file" in
                *.gd) sed -n '1,500p' "$file" ;;
                *.tscn|*.tres) sed -n '1,260p' "$file" ;;
                *.import) sed -n '1,100p' "$file" ;;
              esac
            done < <(find "$PROJECT" -type f \( -path '*character customization*' -o -iname '*customization*' -o -iname '*cosmetic*' -o -iname '*accessor*' \) \( -name '*.gd' -o -name '*.tscn' -o -name '*.tres' -o -name '*.import' \) -print | sort)
            echo
            echo "===== CUSTOMIZATION RESOURCE REFERENCES ====="
            grep -RIn --include='*.gd' --include='*.tscn' --include='*.tres' -E 'hat|glasses|cosmetic|accessor|customization|SubViewport|ViewportTexture|texture *=|load\(|preload\(' "$PROJECT/scripts" "$PROJECT/scenes" "$PROJECT/modules" 2>/dev/null | grep -Ei 'custom|hat|glass|cosmetic|accessor|viewport' | head -700 || true
            echo
            echo "===== MENU / SCENE LIFECYCLE SOURCE ====="
            for rel in scenes/main_menu/scripts/main_menu.gd scenes/character_customization.tscn scenes/main_menu/main_menu.tscn autoloads/game_manager.gd modules/multiplayer/network_manager.gd modules/player_presence/player_presence.gd modules/effect_manager/effect_manager.gd modules/decal_manager/decal_manager.gd modules/prop_manager/scripts/prop_manager.gd minigames/intermission_new/components/intermission_user_container_2d.gd minigames/intermission_new/components/intermission_briefing_screen.gd minigames/forklift_certified/components/vehicle/scripts/forklift_certified_vehicle.gd minigames/forklift_certified/scripts/crate_manager.gd; do
              file="$PROJECT/$rel"
              if [ -f "$file" ]; then
                echo
                echo "----- $rel -----"
                case "$file" in *.gd) sed -n '1,500p' "$file" ;; *.tscn) sed -n '1,240p' "$file" ;; esac
              fi
            done
            echo
            echo "===== STARTUP / INTRO / LOADING SOURCE FILES ====="
            while IFS= read -r file; do
              echo
              echo "----- \${file#"$PROJECT/"} -----"
              case "$file" in
                *.gd) sed -n '1,500p' "$file" ;;
                *.tscn) sed -n '1,260p' "$file" ;;
              esac
            done < <(find "$PROJECT/scenes" "$PROJECT/modules" "$PROJECT/minigames/intermission_new" -type f \( -iname '*splash*' -o -iname '*intro*' -o -iname '*loading*' -o -iname '*intermission*' \) \( -name '*.gd' -o -name '*.tscn' \) -print | sort | head -80)
            echo
            echo "===== MUSIC MANAGER / MENU TRACK REFERENCES ====="
            while IFS= read -r file; do
              echo
              echo "----- \${file#"$PROJECT/"} -----"
              sed -n '1,360p' "$file"
            done < <(find "$PROJECT" -type f \( -iname '*music*manager*.gd' -o -iname '*music*handler*.gd' \) -print | sort)
            grep -RIn --include='*.gd' --include='*.tscn' -E 'music loop main menu|menu music[12]|MusicManager|play_music' "$PROJECT/scenes" "$PROJECT/autoloads" "$PROJECT/modules" 2>/dev/null | head -240 || true
            echo
            echo "===== CAPSULE INTRO ANIMATION RESOURCE TIMINGS ====="
            SCENE="$PROJECT/minigames/intermission_new/intermission_new.tscn"
            if [ -f "$SCENE" ]; then
              grep -n -A90 -B30 -E 'insert vessel|intro2 setup|intro2|intro3|scientist_ik' "$SCENE" | head -1200 || true
            fi
            echo
            echo "===== CAPSULE INTRO SCRIPT ====="
            INTRO="$PROJECT/minigames/intermission_new/components/intermission_cutscene_intro.gd"
            if [ -f "$INTRO" ]; then sed -n '1,360p' "$INTRO"; fi
            echo
            echo "===== FORKLIFT CERTIFIED PLAYER / VEHICLE SCRIPTS ====="
            while IFS= read -r file; do
              echo
              echo "----- ${file#"$PROJECT/"} -----"
              sed -n '1,420p' "$file"
            done < <(find "$PROJECT/minigames/forklift_certified" -type f -name '*.gd' -print | sort | head -80)
            echo
            echo "===== MOBILE RENDER / PROJECT SETTINGS ====="
            grep -nE '^\[rendering\]|renderer/|textures/|scaling_3d|fps|physics/common|environment/defaults' "$PROJECT/project.godot" || true
          } > "$REPORT"
          cat "$REPORT"
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-performance-input-audit
          path: audit/mobile-performance-input.txt
          retention-days: 7

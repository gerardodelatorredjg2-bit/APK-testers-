name: Publish current Machine Party LAN ARMv7 build

on:
  push:
    branches:
      - "recovery/lan-multiplayer"
    paths:
      - ".github/workflows/publish-current-machine-party-armv7.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download the verified ARMv7 build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download 44390003982 \
            --repo "$GH_REPO" \
            --name machine-party-lan-android \
            --dir release-assets
          test -s release-assets/MachineParty-LAN-armv7.apk
          test -s release-assets/MachineParty-LAN-armv7.7z
          7z t release-assets/MachineParty-LAN-armv7.7z
          (cd release-assets && sha256sum MachineParty-LAN-armv7.7z > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt

      - name: Publish ARMv7 compressed package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="machine-party-lan-armv7-44390003982"
          gh release create "$TAG" \
            release-assets/MachineParty-LAN-armv7.7z \
            release-assets/SHA256SUMS.txt \
            --repo "$GH_REPO" \
            --title "Machine Party LAN - Android ARMv7" \
            --notes "ARMv7 (armeabi-v7a) build for sideload testing. Local ENet multiplayer over the same Wi-Fi network or hotspot. Exported with Godot 4.5.2, signed with a debug key. Build run: 44390003982."

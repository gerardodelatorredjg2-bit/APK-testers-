name: Diagnose Machine Party mobile UI and minigame sources

on:
  push:
    branches:
      - "recovery/ui-performance-review"
    paths:
      - ".github/workflows/diagnose-machine-party-mobile.yml"

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Download recovered source and publish gameplay load-flow excerpts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p downloaded docs/diagnostics
          gh run download 44350091150 --repo "$GH_REPO" --name machine-party-recovery --dir downloaded
          PROJECT="$PWD/downloaded/recovered"
          REPORT="$PWD/docs/diagnostics/gameplay-load-flow.txt"
          {
            for spec in \
              "modules/multiplayer/network_manager.gd:1:320" \
              "scenes/lobby/scripts/lobby_scene.gd:1:540" \
              "scenes/lobby/components/playlist_handler.gd:1:300" \
              "modules/multiplayer_lobby/components/lobby_handler/lobby_handler.gd:180:270" \
              "autoloads/globals.gd:420:590" \
              "autoloads/game_manager.gd:1:190"; do
              file="${spec%%:*}"
              rest="${spec#*:}"
              start="${rest%%:*}"
              end="${rest##*:}"
              echo
              echo "===== $file lines $start-$end ====="
              sed -n "${start},${end}p" "$PROJECT/$file"
            done
          } | tee "$REPORT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          git commit -m "Add gameplay loading flow audit"
          git push origin "HEAD:${{ github.ref_name }}"

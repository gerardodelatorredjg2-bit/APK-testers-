          echo "===== NETWORK MANAGER SOURCE ====="
          sed -n '1,340p' "$PROJECT/modules/multiplayer/network_manager.gd"
          echo "===== ONLINE ENET BACKEND SOURCE ====="
          sed -n '1,420p' "$PROJECT/modules/multiplayer/backends/online_enet_backend.gd"
          echo "===== LAN BACKEND SOURCE ====="
          sed -n '1,240p' "$PROJECT/modules/multiplayer/backends/lan_enet_backend.gd"
          echo "===== LOBBY NETWORK CALLS ====="
          grep -n -C 5 -E 'start_host|start_client|join_host|join_client|on_client_created|on_server_created|on_matchmaking_error|join_lobby_id' "$PROJECT/scenes/lobby/scripts/lobby_scene.gd" || true
          echo "===== MAIN MENU JOIN DIALOG AND HOST CALLS ====="
          grep -n -C 5 -E '_show_lan_join_dialog|_join_with_address_or_code|start_join_button|start_host_button|host_game|join_lobby_id' "$PROJECT/scenes/main_menu/scripts/main_menu.gd" || true

      - name: Audit Android touch controls, menus, networking fields and rendering settings
        run: |
